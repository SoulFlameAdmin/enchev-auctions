name: SYSTEM 48.01 IaC Baseline

on:
  pull_request:
    paths:
      - "config/enchev-iac-baseline.json"
      - "docs/48_01_INFRASTRUCTURE_AS_CODE_BASELINE.md"
      - "scripts/verify-infrastructure-as-code-baseline.mjs"
      - "scripts/run-system-test-pre-gates.mjs"
      - "scripts/verify-plan-version-ui.mjs"
      - ".github/workflows/system-48-01-iac-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iac-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Repository IaC inventory
        run: node scripts/verify-infrastructure-as-code-baseline.mjs
      - name: Fail-closed IaC negative self-tests
        run: node scripts/verify-infrastructure-as-code-baseline.mjs --self-test
      - name: Frozen plan version visible in BG/EN
        run: node scripts/verify-plan-version-ui.mjs && node scripts/verify-plan-version-ui.mjs --self-test

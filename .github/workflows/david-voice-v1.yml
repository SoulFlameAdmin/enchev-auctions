name: DAVID Voice V1 guardian checks
on:
  pull_request:
    paths:
      - 'tools/david/voice/**'
      - '.github/workflows/david-voice-v1.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/david/voice/voice-guardian.test.mjs

name: Propose Secure Lockfile
on:
  push:
    branches:
      - fix/cinematic-intro-platform-navigation
    paths:
      - .github/workflows/propose-secure-lockfile.yml
permissions:
  contents: read
jobs:
  audit-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Resolve patched transitive packages without running dependency scripts
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Require zero HIGH and CRITICAL dependency advisories
        run: npm audit --package-lock-only --audit-level=high
      - name: Report lockfile scope and export public lockfile as UTF-8 base64
        run: |
          git diff --stat -- package-lock.json package.json
          echo "BEGIN_PUBLIC_LOCKFILE_BASE64"
          base64 -w 0 package-lock.json
          echo
          echo "END_PUBLIC_LOCKFILE_BASE64"

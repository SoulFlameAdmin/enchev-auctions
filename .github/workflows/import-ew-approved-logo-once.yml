name: Import approved E&W logo once
on:
  push:
    paths:
      - '.github/workflows/import-ew-approved-logo-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import precisely approved PNG from expiring source
        env:
          ASSET_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a40c-820a-9a16-b3ef97b37c40/raw?se=2026-11-01T00%3A15%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=e643f7b6-ecc3-5bce-b5aa-302269fa01b4&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T07%3A51%3A52Z&ske=2026-11-01T07%3A51%3A52Z&sks=b&skv=2026-02-06&sig=53xcrWsDgyhi8sLy3tb2qRDsc0QOmkkIl8BFU6LnKl8%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error "$ASSET_URL" --output public/brand/east-west-auctioneer-group-approved.png
          echo "d9e4a175f7498ec9969e87e469f9d55f301fbeec1f919396182669682ed6e0ec  public/brand/east-west-auctioneer-group-approved.png" | sha256sum --check -
          file public/brand/east-west-auctioneer-group-approved.png
          git config user.name "Enchev Logo Update Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/east-west-auctioneer-group-approved.png
          git rm .github/workflows/import-ew-approved-logo-once.yml
          git commit -m "assets: import approved original E&W logo without modification"
          git push origin HEAD:main

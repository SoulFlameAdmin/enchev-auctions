name: Verify Enchev Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-enchev-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate frozen test task registry
        run: node scripts/generate-master-test-task-ids.mjs
      - name: Repository lint
        run: npm run lint
      - name: CI quality gate contract
        run: node scripts/verify-ci-quality-gates.mjs
      - name: Frozen master task ID lock
        run: node scripts/verify-master-task-ids.mjs
      - name: Frozen delete/renumber rejection tests
        run: node scripts/verify-master-task-ids.mjs --self-test
      - name: International company expansion invariant
        run: node scripts/verify-master-system-expansion-v2.mjs
      - name: International company expansion self-tests
        run: node scripts/verify-master-system-expansion-v2.mjs --self-test
      - name: GREEN evidence invariant
        run: node scripts/verify-green-requires-evidence.mjs
      - name: GREEN evidence rejection tests
        run: node scripts/verify-green-requires-evidence.mjs --self-test
      - name: GREEN passing-test invariant
        run: node scripts/verify-green-requires-passing-test.mjs
      - name: GREEN passing-test rejection tests
        run: node scripts/verify-green-requires-passing-test.mjs --self-test
      - name: YELLOW semantics invariant
        run: node scripts/verify-yellow-semantics.mjs
      - name: YELLOW semantics self-tests
        run: node scripts/verify-yellow-semantics.mjs --self-test
      - name: RED semantics invariant
        run: node scripts/verify-red-semantics.mjs
      - name: RED semantics self-tests
        run: node scripts/verify-red-semantics.mjs --self-test
      - name: Append-only GAP ID invariant
        run: node scripts/verify-gap-append-only.mjs
      - name: Append-only GAP ID self-tests
        run: node scripts/verify-gap-append-only.mjs --self-test
      - name: Status audit trail invariant
        run: node scripts/verify-status-audit-trail.mjs
      - name: Status audit trail self-tests
        run: node scripts/verify-status-audit-trail.mjs --self-test
      - name: Cloud plan state invariant
        run: node scripts/verify-cloud-plan-state.mjs
      - name: Cloud plan state self-tests
        run: node scripts/verify-cloud-plan-state.mjs --self-test
      - name: Plan version UI invariant
        run: node scripts/verify-plan-version-ui.mjs
      - name: Plan version UI self-tests
        run: node scripts/verify-plan-version-ui.mjs --self-test
      - name: Supabase project binding invariant
        run: node scripts/verify-supabase-project-binding.mjs
      - name: Supabase project binding self-tests
        run: node scripts/verify-supabase-project-binding.mjs --self-test
      - name: Supabase project live endpoint
        run: node scripts/verify-supabase-project-binding.mjs --live
      - name: Environment variable contract invariant
        run: node scripts/verify-environment-variables.mjs
      - name: Environment variable contract self-tests
        run: node scripts/verify-environment-variables.mjs --self-test
      - name: Environment variable runtime probe
        run: node scripts/verify-environment-variables.mjs --runtime
      - name: Health endpoint contract invariant
        run: node scripts/verify-health-endpoints.mjs
      - name: Health endpoint contract self-tests
        run: node scripts/verify-health-endpoints.mjs --self-test
      - name: apps/web architecture boundary
        run: node scripts/verify-apps-web.mjs
      - name: apps/web architecture self-tests
        run: node scripts/verify-apps-web.mjs --self-test
      - name: apps/api architecture boundary
        run: node scripts/verify-apps-api.mjs
      - name: apps/api architecture self-tests
        run: node scripts/verify-apps-api.mjs --self-test
      - name: apps/realtime architecture boundary
        run: node scripts/verify-apps-realtime.mjs
      - name: apps/realtime architecture self-tests
        run: node scripts/verify-apps-realtime.mjs --self-test
      - name: apps/worker architecture boundary
        run: node scripts/verify-apps-worker.mjs
      - name: apps/worker architecture self-tests
        run: node scripts/verify-apps-worker.mjs --self-test
      - name: packages/domain architecture boundary
        run: node scripts/verify-packages-domain.mjs
      - name: packages/domain architecture self-tests
        run: node scripts/verify-packages-domain.mjs --self-test
      - name: packages/contracts architecture boundary
        run: node scripts/verify-packages-contracts.mjs
      - name: packages/contracts architecture self-tests
        run: node scripts/verify-packages-contracts.mjs --self-test
      - name: packages/config architecture boundary
        run: node scripts/verify-packages-config.mjs
      - name: packages/config architecture self-tests
        run: node scripts/verify-packages-config.mjs --self-test
      - name: packages/providers architecture boundary
        run: node scripts/verify-packages-providers.mjs
      - name: packages/providers architecture self-tests
        run: node scripts/verify-packages-providers.mjs --self-test
      - name: database migrations structure
        run: node scripts/verify-database-migrations-structure.mjs
      - name: database migrations structure self-tests
        run: node scripts/verify-database-migrations-structure.mjs --self-test
      - name: architecture decision records
        run: node scripts/verify-architecture-decision-records.mjs
      - name: architecture decision records self-tests
        run: node scripts/verify-architecture-decision-records.mjs --self-test
      - name: 21.01 CountryProfile configuration model
        run: node scripts/verify-country-profile-model.mjs
      - name: 21.01 CountryProfile configuration model self-tests
        run: node scripts/verify-country-profile-model.mjs --self-test
      - name: 21.02 No country-specific hardcoding
        run: node scripts/verify-no-country-hardcoding.mjs
      - name: 21.02 No country-specific hardcoding self-tests
        run: node scripts/verify-no-country-hardcoding.mjs --self-test
      - name: 21.03 Locale-aware dates
        run: node scripts/verify-locale-aware-dates.mjs
      - name: 21.03 Locale-aware dates self-tests
        run: node scripts/verify-locale-aware-dates.mjs --self-test
      - name: 21.04 Timezone-aware display
        run: node scripts/verify-timezone-aware-display.mjs
      - name: 21.04 Timezone-aware display self-tests
        run: node scripts/verify-timezone-aware-display.mjs --self-test
      - name: 21.05 BG locale
        run: node scripts/verify-bg-locale.mjs
      - name: 21.05 BG locale self-tests
        run: node scripts/verify-bg-locale.mjs --self-test
      - name: 21.06 EN locale
        run: node scripts/verify-en-locale.mjs
      - name: 21.06 EN locale self-tests
        run: node scripts/verify-en-locale.mjs --self-test
      - name: 21.07 Translation key architecture
        run: node scripts/verify-translation-key-architecture.mjs
      - name: 21.07 Translation key architecture self-tests
        run: node scripts/verify-translation-key-architecture.mjs --self-test
      - name: 21.08 Country-specific KYC profile
        run: node scripts/verify-country-kyc-profile.mjs
      - name: 21.08 Country-specific KYC profile self-tests
        run: node scripts/verify-country-kyc-profile.mjs --self-test
      - name: 21.09 Country-specific legal profile
        run: node scripts/verify-country-legal-profile.mjs
      - name: 21.09 Country-specific legal profile self-tests
        run: node scripts/verify-country-legal-profile.mjs --self-test
      - name: 21.10 Country-specific document profile
        run: node scripts/verify-country-document-profile.mjs
      - name: 21.10 Country-specific document profile self-tests
        run: node scripts/verify-country-document-profile.mjs --self-test
      - name: 21.11 Market activation gate
        run: node scripts/verify-market-activation-gate.mjs
      - name: 21.11 Market activation gate self-tests
        run: node scripts/verify-market-activation-gate.mjs --self-test
      - name: 21.12 Country #2 without core rewrite
        run: node scripts/verify-country-2-without-core-rewrite.mjs
      - name: 21.12 Country #2 without core rewrite self-tests
        run: node scripts/verify-country-2-without-core-rewrite.mjs --self-test
      - name: 21.13 Regional CDN strategy
        run: node scripts/verify-regional-cdn-strategy.mjs
      - name: 21.13 Regional CDN strategy self-tests
        run: node scripts/verify-regional-cdn-strategy.mjs --self-test
      - name: 21.14 Regional data/residency review
        run: node scripts/verify-regional-data-residency-review.mjs
      - name: 21.14 Regional data/residency review self-tests
        run: node scripts/verify-regional-data-residency-review.mjs --self-test
      - name: 21.15 Unicode normalization
        run: node scripts/verify-unicode-normalization.mjs
      - name: 21.15 Unicode normalization self-tests
        run: node scripts/verify-unicode-normalization.mjs --self-test
      - name: Redis environment contract invariant
        run: node scripts/verify-redis-environment.mjs
      - name: Redis environment contract self-tests
        run: node scripts/verify-redis-environment.mjs --self-test
      - name: Redis production acceptance gate self-tests
        run: node scripts/verify-redis-production-gate.mjs --self-test
      - name: Redis provisioning credential availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          REDIS_CLOUD_API_KEY: ${{ secrets.REDIS_CLOUD_API_KEY }}
          REDIS_CLOUD_SECRET_KEY: ${{ secrets.REDIS_CLOUD_SECRET_KEY }}
        run: node scripts/detect-redis-provisioning-credentials.mjs
      - name: DAVID worker syntax checks
        run: |
          node --check tools/david/auto-continue-enchev-v5.mjs
          node --check tools/david/auto-continue-design-v1.mjs
          node --check tools/david/auto-continue-david-apk-v1.mjs
          node --check tools/david/auto-control-watchtower-v1.mjs
          node --check tools/david/dual-session-worker.mjs
          node --check tools/david/worker-control.mjs
          node --check dual-session-worker.mjs
          node --check tools/david/connection-interruption-guard.mjs
          node --check tools/david/chatgpt-rate-limit-coordinator.mjs
          node --check tools/david/auto-complete-app2-v1.mjs
      - name: DAVID legacy owner guards
        run: |
          node -e "const fs=require('fs');const c=fs.readFileSync('tools/david/worker-control.mjs','utf8');if(c.includes('setTimeout(() => startWorker(), 900)')||c.includes('Auto-restart in 3s')){throw new Error('legacy worker-control still owns DAVID lifecycle')};const r=fs.readFileSync('dual-session-worker.mjs','utf8');if(!r.includes('Legacy root dual-session-worker.mjs is disabled')){throw new Error('legacy root supervisor is not disabled')};console.log('DAVID_LEGACY_OWNER_GUARD PASS');"

      - name: DAVID SYSTEM response watchdog self-tests
        run: node tools/david/auto-continue-enchev-v5.mjs --self-test
      - name: DAVID APP2 response watchdog self-tests
        run: node tools/david/auto-complete-app2-v1.mjs --self-test
      - name: DAVID CONTROL watchtower self-tests
        run: node tools/david/auto-control-watchtower-v1.mjs --self-test
      - name: DAVID ChatGPT rate-limit coordinator self-tests
        run: node tools/david/chatgpt-rate-limit-coordinator.mjs --self-test
      - name: DAVID PowerShell syntax checks
        shell: pwsh
        run: |
          function Test-PowerShellFile([string]$Path) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$Path :: $($_.Message)" }
              throw "PowerShell syntax check failed: $Path"
            }
          }
          Test-PowerShellFile "$PWD/START_DAVID_ALL.ps1"
          Test-PowerShellFile "$PWD/STOP_DAVID_ALL_CLEAN.ps1"
          Test-PowerShellFile "$PWD/RESTART_DAVID_ALL_CLEAN.ps1"
          Test-PowerShellFile "$PWD/tools/david/david-status-dashboard.ps1"
      - name: Redis live binding verification when configured
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "${REDIS_URL}${UPSTASH_REDIS_REST_URL}${UPSTASH_REDIS_REST_TOKEN}${KV_REST_API_URL}${KV_REST_API_TOKEN}" ]; then
            node scripts/verify-redis-environment.mjs --live
          else
            echo "REDIS_ENV_LIVE SKIP no Redis binding secret configured"
          fi
      - name: Design Process 2 invariant
        run: node scripts/verify-design-process-2.mjs
      - name: Design Process 2 self-tests
        run: node scripts/verify-design-process-2.mjs --self-test
      - name: Mobile-first design invariant
        run: node scripts/verify-mobile-first-design.mjs
      - name: Mobile-first design self-tests
        run: node scripts/verify-mobile-first-design.mjs --self-test
      - name: Accessibility visual invariant
        run: node scripts/verify-accessibility-visual-pass.mjs
      - name: Accessibility visual self-tests
        run: node scripts/verify-accessibility-visual-pass.mjs --self-test
      - name: Cross-browser visual contract
        run: node scripts/verify-cross-browser-visual-contract.mjs
      - name: Cross-browser visual self-tests
        run: node scripts/verify-cross-browser-visual-contract.mjs --self-test
      - name: ENCHEV final identity/originality invariant
        run: node scripts/verify-enchev-final-consistency.mjs
      - name: ENCHEV final identity/originality self-tests
        run: node scripts/verify-enchev-final-consistency.mjs --self-test
      - name: CI test suite
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Built health endpoint smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 -p 3010 > /tmp/enchev-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3010/api/health/web > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/enchev-next.log
              exit 1
            fi
            sleep 1
          done
          node scripts/verify-health-endpoints.mjs --live http://127.0.0.1:3010
      - name: Install Microsoft Edge stable
        shell: bash
        run: |
          curl --fail --silent --show-error https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/microsoft-edge.gpg
          sudo install -o root -g root -m 644 /tmp/microsoft-edge.gpg /usr/share/keyrings/microsoft-edge.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y microsoft-edge-stable
          microsoft-edge --version
      - name: Chrome and Edge visual regression screenshots
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 -p 3011 > /tmp/enchev-visual.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3011/api/health/web > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/enchev-visual.log
              exit 1
            fi
            sleep 1
          done

          node scripts/capture-visual-regression.mjs http://127.0.0.1:3011
          cp -R artifacts/visual-regression artifacts/visual-regression-chrome

          rm -rf artifacts/visual-regression
          CHROME_BIN="$(command -v microsoft-edge)" node scripts/capture-visual-regression.mjs http://127.0.0.1:3011
          mv artifacts/visual-regression artifacts/visual-regression-edge
          mv artifacts/visual-regression-chrome artifacts/visual-regression

          node -e 'const fs=require("fs"); const chrome=JSON.parse(fs.readFileSync("artifacts/visual-regression/manifest.json","utf8")); const edge=JSON.parse(fs.readFileSync("artifacts/visual-regression-edge/manifest.json","utf8")); if(chrome.count!==30||edge.count!==30) process.exit(1); if(!/edge/i.test(edge.browserExecutable)) process.exit(1); const widths=[...new Set(chrome.entries.map(e=>e.width))].sort((a,b)=>a-b).join(","); if(widths!=="360,390,430,1366,1440,1920") process.exit(1); console.log("DP2_RESPONSIVE_BROWSER_MATRIX PASS chrome=30 edge=30 widths="+widths);'
      - name: Upload Chrome and Edge visual regression artifact
        uses: actions/upload-artifact@v4
        with:
          name: enchev-cross-browser-visual-${{ github.sha }}
          path: |
            artifacts/visual-regression
            artifacts/visual-regression-edge
          if-no-files-found: error
          retention-days: 14

  sync-plan-cloud:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync verified Master Plan state to Supabase
        run: node scripts/sync-cloud-plan-state.mjs

name: Verify Enchev Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-enchev-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate frozen test task registry
        run: node scripts/generate-master-test-task-ids.mjs
      - name: Repository lint
        run: npm run lint
      - name: CI quality gate contract
        run: node scripts/verify-ci-quality-gates.mjs
      - name: Frozen master task ID lock
        run: node scripts/verify-master-task-ids.mjs
      - name: Frozen delete/renumber rejection tests
        run: node scripts/verify-master-task-ids.mjs --self-test
      - name: GREEN evidence invariant
        run: node scripts/verify-green-requires-evidence.mjs
      - name: GREEN evidence rejection tests
        run: node scripts/verify-green-requires-evidence.mjs --self-test
      - name: GREEN passing-test invariant
        run: node scripts/verify-green-requires-passing-test.mjs
      - name: GREEN passing-test rejection tests
        run: node scripts/verify-green-requires-passing-test.mjs --self-test
      - name: YELLOW semantics invariant
        run: node scripts/verify-yellow-semantics.mjs
      - name: YELLOW semantics self-tests
        run: node scripts/verify-yellow-semantics.mjs --self-test
      - name: RED semantics invariant
        run: node scripts/verify-red-semantics.mjs
      - name: RED semantics self-tests
        run: node scripts/verify-red-semantics.mjs --self-test
      - name: Append-only GAP ID invariant
        run: node scripts/verify-gap-append-only.mjs
      - name: Append-only GAP ID self-tests
        run: node scripts/verify-gap-append-only.mjs --self-test
      - name: Status audit trail invariant
        run: node scripts/verify-status-audit-trail.mjs
      - name: Status audit trail self-tests
        run: node scripts/verify-status-audit-trail.mjs --self-test
      - name: Cloud plan state invariant
        run: node scripts/verify-cloud-plan-state.mjs
      - name: Cloud plan state self-tests
        run: node scripts/verify-cloud-plan-state.mjs --self-test
      - name: Plan version UI invariant
        run: node scripts/verify-plan-version-ui.mjs
      - name: Plan version UI self-tests
        run: node scripts/verify-plan-version-ui.mjs --self-test
      - name: Supabase project binding invariant
        run: node scripts/verify-supabase-project-binding.mjs
      - name: Supabase project binding self-tests
        run: node scripts/verify-supabase-project-binding.mjs --self-test
      - name: Supabase project live endpoint
        run: node scripts/verify-supabase-project-binding.mjs --live
      - name: Environment variable contract invariant
        run: node scripts/verify-environment-variables.mjs
      - name: Environment variable contract self-tests
        run: node scripts/verify-environment-variables.mjs --self-test
      - name: Environment variable runtime probe
        run: node scripts/verify-environment-variables.mjs --runtime
      - name: Redis environment contract invariant
        run: node scripts/verify-redis-environment.mjs
      - name: Redis environment contract self-tests
        run: node scripts/verify-redis-environment.mjs --self-test
      - name: Redis production acceptance gate self-tests
        run: node scripts/verify-redis-production-gate.mjs --self-test
      - name: Redis provisioning credential availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          REDIS_CLOUD_API_KEY: ${{ secrets.REDIS_CLOUD_API_KEY }}
          REDIS_CLOUD_SECRET_KEY: ${{ secrets.REDIS_CLOUD_SECRET_KEY }}
        run: node scripts/detect-redis-provisioning-credentials.mjs
      - name: DAVID worker syntax checks
        run: |
          node --check tools/david/auto-continue-enchev-v5.mjs
          node --check tools/david/auto-continue-design-v1.mjs
          node --check tools/david/auto-continue-david-apk-v1.mjs
          node --check tools/david/dual-session-worker.mjs
          node --check tools/david/auto-complete-app2-v1.mjs
      - name: DAVID SYSTEM response watchdog self-tests
        run: node tools/david/auto-continue-enchev-v5.mjs --self-test
      - name: DAVID APP2 response watchdog self-tests
        run: node tools/david/auto-complete-app2-v1.mjs --self-test
      - name: DAVID PowerShell syntax checks
        shell: pwsh
        run: |
          function Test-PowerShellFile([string]$Path) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$Path :: $($_.Message)" }
              throw "PowerShell syntax check failed: $Path"
            }
          }
          Test-PowerShellFile "$PWD/START_DAVID_ALL.ps1"
          Test-PowerShellFile "$PWD/tools/david/david-status-dashboard.ps1"
      - name: Redis live binding verification when configured
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "${REDIS_URL}${UPSTASH_REDIS_REST_URL}${UPSTASH_REDIS_REST_TOKEN}${KV_REST_API_URL}${KV_REST_API_TOKEN}" ]; then
            node scripts/verify-redis-environment.mjs --live
          else
            echo "REDIS_ENV_LIVE SKIP no Redis binding secret configured"
          fi
      - name: CI test suite
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  sync-plan-cloud:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync verified Master Plan state to Supabase
        run: node scripts/sync-cloud-plan-state.mjs

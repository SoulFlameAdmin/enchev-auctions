name: Verify Enchev Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-enchev-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency review (26.09)
        if: github.event_name == 'pull_request'
        run: npm audit --package-lock-only --audit-level=high
      - name: Staging deployment pipeline contract (26.04)
        run: node scripts/verify-staging-deployment-pipeline.mjs
      - name: Staging deployment pipeline self-tests (26.04)
        run: node scripts/verify-staging-deployment-pipeline.mjs --self-test
      - name: Production approval gate contract (26.05)
        run: node scripts/verify-production-approval-gate.mjs
      - name: Production approval gate self-tests (26.05)
        run: node scripts/verify-production-approval-gate.mjs --self-test
      - name: Deployment concurrency control (26.06)
        run: node scripts/verify-deployment-concurrency-control.mjs
      - name: Deployment concurrency control self-tests (26.06)
        run: node scripts/verify-deployment-concurrency-control.mjs --self-test

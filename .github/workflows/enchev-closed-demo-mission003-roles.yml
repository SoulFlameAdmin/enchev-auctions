name: ENCHEV CLOSED DEMO MISSION-003 roles (policy only)
on:
  pull_request:
    paths:
      - "packages/domain/src/closed-demo-isolation.ts"
      - "packages/domain/src/closed-demo-roles.ts"
      - "packages/domain/src/index.ts"
      - "scripts/verify-enchev-closed-demo-roles.mjs"
      - "docs/ENCHEV_CLOSED_DEMO_MISSION003_ROLES_2026-10-30.md"
      - ".github/workflows/enchev-closed-demo-mission003-roles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check verifier syntax
        run: node --check scripts/verify-enchev-closed-demo-roles.mjs
      - name: MISSION-003 positive/negative policy fixtures
        run: node scripts/verify-enchev-closed-demo-roles.mjs
      - name: Repository TypeScript check
        run: npx tsc --noEmit --pretty false

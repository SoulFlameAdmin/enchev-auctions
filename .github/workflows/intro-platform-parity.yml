name: Intro to Classic Platform Parity
on:
  push:
    branches:
      - fix/cinematic-intro-platform-navigation
  pull_request:
    paths:
      - app/**
      - scripts/restore-forge-assets.mjs
      - scripts/verify-intro-platform-parity.mjs
      - package.json
      - .github/workflows/intro-platform-parity.yml
permissions:
  contents: read
jobs:
  route-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify intro and preserved marketplace routes
        run: node scripts/verify-intro-platform-parity.mjs

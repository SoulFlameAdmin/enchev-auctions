name: E&W approved brand guard
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/brand/**'
      - 'public/3d-login/**'
      - '.github/workflows/ew-approved-brand-guard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved original attachment SHA-256
        run: |
          echo 'd9e4a175f7498ec9969e87e469f9d55f301fbeec1f919396182669682ed6e0ec  public/brand/east-west-auctioneer-group-approved.png' | sha256sum -c -
      - name: Reject old E&A logo references in site code
        run: |
          set -eu
          if git grep -nE '/brand/ea-(approved|east-west|2026|primary|app|horizontal)' -- app public/3d-login/index.html; then
            echo 'Old approved-logo assets are still referenced in the Enchev website.' >&2
            exit 1
          fi
          git grep -n 'east-west-auctioneer-group-approved.png' -- app public/3d-login/index.html >/dev/null
          echo 'PASS: approved original logo is used, and old E&A logo paths are absent.'

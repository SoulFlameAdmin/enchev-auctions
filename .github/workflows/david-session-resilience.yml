name: DAVID Session Resilience

on:
  pull_request:
    paths:
      - "tools/david/**"
      - "START_DAVID_ALL.ps1"
      - "START_SF_SCIENTIST.ps1"
      - "STOP_SF_SCIENTIST.ps1"
      - "START_SF_SCIENTIST.ps1"
      - "STOP_SF_SCIENTIST.ps1"
      - "START_DAVID_AUTONOMY.ps1"
      - "START_DAVID_SINGLE.ps1"
      - "RESTART_DAVID_SINGLE_CLEAN.ps1"
      - "START_DAVID_EXPERIMENT_FREETALK.ps1"
      - "START_DAVID_FREETALK_ONLY.ps1"
      - "RESTART_DAVID_FREETALK_ONLY_CLEAN.ps1"
      - "DAVID_MODE_SELECTOR.ps1"
      - "DAVID_MODE_SELECTOR_V2.ps1"
      - "DAVID_MODE_SELECTOR_V2.cmd"
      - "DAVID_MATRIX_START.ps1"
      - "DAVID_START.ps1"
      - "DAVID_MATRIX_START.cmd"
      - "RESTART_DAVID_ALL_CLEAN.ps1"
      - "RESTART_DAVID_AUTONOMY_CLEAN.ps1"
      - "RESTART_DAVID_EXPERIMENT_FREETALK_CLEAN.ps1"
      - "STOP_DAVID_ALL_CLEAN.ps1"
      - ".github/workflows/david-session-resilience.yml"
  push:
    branches:
      - main
    paths:
      - "tools/david/**"
      - "START_DAVID_ALL.ps1"
      - "START_DAVID_AUTONOMY.ps1"
      - "START_DAVID_SINGLE.ps1"
      - "RESTART_DAVID_SINGLE_CLEAN.ps1"
      - "START_DAVID_FREETALK_ONLY.ps1"
      - "RESTART_DAVID_FREETALK_ONLY_CLEAN.ps1"
      - "DAVID_MODE_SELECTOR.ps1"
      - "DAVID_MODE_SELECTOR_V2.ps1"
      - "DAVID_MODE_SELECTOR_V2.cmd"
      - "DAVID_MATRIX_START.ps1"
      - "DAVID_START.ps1"
      - "DAVID_MATRIX_START.cmd"
      - "RESTART_DAVID_ALL_CLEAN.ps1"
      - "RESTART_DAVID_AUTONOMY_CLEAN.ps1"
      - "RESTART_DAVID_EXPERIMENT_FREETALK_CLEAN.ps1"
      - "STOP_DAVID_ALL_CLEAN.ps1"
      - ".github/workflows/david-session-resilience.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/david
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install DAVID automation dependency
        run: npm install --no-audit --no-fund

      - name: Verify Session Resilience V1
        run: npm run verify:resilience

      - name: Verify scoped AUTONOMY profile
        run: npm run verify:autonomy

      - name: Verify FAST SOLO modes
        run: node verify-fast-solo.mjs

      - name: Verify SF Scientist sidecar
        run: |
          node --check sf-scientist-sidecar.mjs
          node verify-sf-scientist-sidecar.mjs

      - name: Verify ChatGPT effort-mode controller
        run: node chatgpt-effort-mode.mjs --self-test

      - name: Verify ChatGPT send acknowledgement
        run: node chatgpt-send-ack.mjs --self-test

      - name: Verify FREE TALK experiment profile
        run: npm run verify:freetalk

      - name: Verify FREE TALK worker runtime
        run: |
          DAVID_FREE_TALK_ROLE=FREE_A node free-talk-session-v1.mjs --self-test
          DAVID_FREE_TALK_ROLE=FREE_B node free-talk-session-v1.mjs --self-test

      - name: Verify SYSTEM semantic terminal
        run: node auto-continue-enchev-v5.mjs --self-test

      - name: Verify DPP semantic terminal
        run: node auto-complete-app2-v1.mjs --self-test

      - name: Verify APK semantic terminal
        run: node auto-continue-david-apk-v1.mjs --self-test

      - name: Parse PowerShell launch and dashboard scripts
        shell: pwsh
        working-directory: .
        run: |
          $files = @(
            "START_DAVID_ALL.ps1",
            "START_SF_SCIENTIST.ps1",
            "STOP_SF_SCIENTIST.ps1",
            "START_DAVID_AUTONOMY.ps1",
            "START_DAVID_SINGLE.ps1",
            "RESTART_DAVID_SINGLE_CLEAN.ps1",
            "RESTART_DAVID_ALL_CLEAN.ps1",
            "RESTART_DAVID_AUTONOMY_CLEAN.ps1",
            "START_DAVID_EXPERIMENT_FREETALK.ps1",
            "RESTART_DAVID_EXPERIMENT_FREETALK_CLEAN.ps1",
            "START_DAVID_FREETALK_ONLY.ps1",
            "RESTART_DAVID_FREETALK_ONLY_CLEAN.ps1",
            "DAVID_MODE_SELECTOR.ps1",
            "DAVID_MODE_SELECTOR_V2.ps1",
            "DAVID_MATRIX_START.ps1",
            "DAVID_START.ps1",
            "STOP_DAVID_ALL_CLEAN.ps1",
            "tools/david/start-auto-continue.ps1",
            "tools/david/david-status-dashboard.ps1",
            "tools/david/david-autonomy-dashboard.ps1",
            "tools/david/david-freetalk-dashboard.ps1",
            "tools/david/david-freetalk-only-dashboard.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
          Write-Host "DAVID_POWERSHELL_PARSE PASS scripts=$($files.Count)"

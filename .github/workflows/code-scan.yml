name: Code Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify 26.11 gate configuration
        run: node scripts/verify-code-scanning-gate.mjs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df
        with:
          category: "/language:javascript-typescript"

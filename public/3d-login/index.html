<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>ENCHEV AUCTIONS × SOULFLAME | CINEMATIC ACCESS</title>
<link rel="preconnect" href="https://www.webgpu.com" crossorigin>
<link rel="preload" as="image" href="https://www.webgpu.com/content/images/size/w1284/format/webp/2026/03/Screenshot-2026-03-02-at-9.47.14---PM.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#f7f7f7;font-family:Inter,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.screen{height:100dvh;display:grid;grid-template-columns:minmax(0,55%) minmax(0,45%);overflow:hidden;background:#080a0e}
.visual{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 60% 42%,#171d23 0%,#07080d 55%,#000 95%)}
/* A car-only hero is visible instantly. The external WebGL loader is
   intentionally concealed: cross-origin iframe contents cannot be edited. */
.visualFallback{position:absolute;inset:0;z-index:2;overflow:hidden;background:radial-gradient(ellipse at center,#222227,#040506 75%)}
.visualFallback img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 50%;filter:brightness(.94) contrast(1.06);transform:scale(1.055);animation:carArrival 3s cubic-bezier(.18,.75,.17,1) both}
.visualFallback:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.14),transparent 25%,transparent 70%,rgba(0,0,0,.22))}
@keyframes carArrival{from{transform:scale(1.16);filter:brightness(.72) contrast(1.09)}to{transform:scale(1.055);filter:brightness(.94) contrast(1.06)}}
/* Load the real scene behind the seamless still, without exposing GEMINI/NOW LOADING. */
#lusionFrame{position:absolute;top:-86px;left:0;display:block;width:100%;height:calc(100% + 86px);border:0;background:#090a0c;z-index:1}
@media(prefers-reduced-motion:reduce){.visualFallback img{animation:none;transform:scale(1.055)}}

.authPanel{min-width:0;min-height:0;background:linear-gradient(132deg,#171719 0%,#0e0e11 68%,#08090b);padding:clamp(16px,3.3vh,32px) clamp(20px,3.2vw,43px);display:flex;flex-direction:column;overflow:hidden}
.brand{font-weight:850;font-size:clamp(20px,2.25vw,31px);letter-spacing:.16em;line-height:1.03}
.brand span{color:#df1522}
.brandSub{font-size:9px;letter-spacing:.22em;color:#afafb4;margin-top:7px}.brandSub b{color:#dfbf8f;font-weight:550}
.entry{margin:auto 0;min-height:0;max-width:430px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:9px;letter-spacing:.25em;color:#b7b7bc;font-weight:650}
h1{font-size:clamp(27px,3vw,44px);font-weight:700;letter-spacing:-.06em;line-height:1.05;margin:13px 0 8px}
h1 em{font-style:normal;color:#dc0819}
.subtitle{font-size:12px;color:#aab0b7;margin:0 0 clamp(10px,2vh,19px)}
form{display:flex;flex-direction:column}
label{font-size:11px;color:#dedee1;font-weight:600;margin:0 0 6px}
input{height:clamp(35px,6vh,44px);flex:none;background:#1d1f23;border:1px solid #595c65;padding:0 13px;color:#fff;font-size:13px;outline:none;border-radius:2px;margin:0 0 10px;width:100%}
input:focus{border-color:#ddd;box-shadow:0 0 0 2px #ffffff22}
.primary{height:clamp(37px,6vh,46px);border:1px solid #d20a1b;color:#fff;background:#cb0716;font-size:11px;font-weight:750;letter-spacing:.18em;cursor:pointer}
.primary:hover{background:#f00c21}.primary:disabled{opacity:.5}
.separator{margin:14px 0 11px;font-size:9px;letter-spacing:.15em;color:#a4a5aa;display:flex;align-items:center;gap:10px;white-space:nowrap}
.separator:before,.separator:after{content:"";height:1px;background:#ffffff2a;flex:1}
.providers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.provider{height:39px;min-width:0;border:1px solid #595b63;background:#1a1b1f;color:#f3f3f5;font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.provider:hover{border-color:#c8ad82;background:#24262b}
.provider .icon{font-size:17px;font-weight:800;color:#aabffb}
.provider .facebook{font-size:22px;color:#5499fa}
#authMessage{font-size:10px;line-height:1.35;color:#abb3bc;min-height:14px;margin-top:11px}
#authMessage.error{color:#ffa9ac}#authMessage.good{color:#a8e8b7}
.footerLinks{display:flex;justify-content:space-between;gap:12px;font-size:10px;margin-top:11px;color:#d2d2d4}
.footerLinks a{text-decoration:none}.footerLinks a:hover{text-decoration:underline}
.brandFoot{font-size:9px;color:#74777c;letter-spacing:.14em}
@media(max-height:560px) and (min-width:721px){
.authPanel{padding-block:11px}h1{font-size:28px;margin:8px 0 4px}
.subtitle{margin-bottom:7px}.separator{margin:8px 0}.provider{height:32px}
input{height:30px;margin-bottom:6px}.primary{height:32px}
}
@media(max-width:720px){
.screen{display:grid;grid-template-columns:1fr;grid-template-rows:39% 61%}
.visual{grid-row:1;grid-column:1}.authPanel{grid-row:2;grid-column:1;padding:9px 17px 9px}



.brand{font-size:19px}.brandSub{font-size:8px;margin-top:1px}
.entry{max-width:none}.eyebrow{font-size:8px}h1{font-size:clamp(24px,5.2vw,30px);margin:5px 0 4px}
.subtitle{font-size:10px;margin-bottom:6px}
label{font-size:10px;margin-bottom:2px}input{height:30px;margin-bottom:5px;font-size:12px}
.primary{height:30px}.separator{margin:7px 0;font-size:8px}
.provider{height:31px;font-size:10px}#authMessage{font-size:9px;margin-top:5px;min-height:12px}
.footerLinks{margin-top:4px;font-size:9px}.brandFoot{display:none}
}
@media(max-height:620px) and (max-width:720px){
.screen{grid-template-rows:30% 70%}.authPanel{padding-block:4px}
.brand,.brandSub{display:none}.subtitle{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<main class="screen">
<section class="visual" id="visual" aria-label="Оригинален Lusion GEMINI вграден уебсайт">
<div class="visualFallback" aria-hidden="true">
<img
  src="https://www.webgpu.com/content/images/size/w1284/format/webp/2026/03/Screenshot-2026-03-02-at-9.47.14---PM.png"
  alt=""
  fetchpriority="high"
  decoding="async"
  onerror="this.onerror=null;this.src='https://assets.awwwards.com/awards/sites_of_the_day/2021/12/exp-gemini-lusion-1.jpg'"
>
</div>
<iframe
  id="lusionFrame"
  title="Lusion GEMINI — original interactive 3D experience"
  src="https://exp-gemini.lusion.co/"
  referrerpolicy="strict-origin-when-cross-origin"
  allow="autoplay; fullscreen; accelerometer; gyroscope"
  loading="eager"
></iframe>

</section>
<section class="authPanel" aria-label="Вход в ENCHEV">
<header><div class="brand">ENCHEV<span>.</span></div><div class="brandSub">AUCTIONS — <b>SOULFLAME</b></div></header>
<div class="entry">
<div class="eyebrow">PRIVATE MEMBER ACCESS</div>
<h1>Добре дошли<em>.</em></h1>
<p class="subtitle">Влезте в света на автомобилните търгове.</p>
<form id="authForm" novalidate>
<label for="email">Имейл адрес</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
<label for="password">Парола</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required placeholder="Вашата парола">
<button class="primary" id="submit" type="submit">ВХОД &nbsp; ↗</button>
</form>
<div class="separator"><span>ИЛИ ПРОДЪЛЖИ С</span></div>
<div class="providers">
<button class="provider" type="button" data-provider="google"><span class="icon">G</span> Google</button>
<button class="provider" type="button" data-provider="meta"><span class="icon facebook">f</span> Meta</button>
<button class="provider" type="button" data-provider="phone"><span class="icon">☎</span> Телефон</button>
</div>
<div id="authMessage" role="status" aria-live="polite">Проверка на възможностите за вход...</div>
<nav class="footerLinks"><a href="/register" target="_top">Регистрация</a><a href="/platform" target="_top">Разгледай демото ↗</a></nav>
</div>
<footer class="brandFoot">ENCHEV AUCTIONS &nbsp; · &nbsp; POWERED BY SOULFLAME</footer>
</section>
</main>
<script>
(() => {
// Exact official Gemini site is embedded directly; no video, GLB,
// Vimeo substitute or cross-origin pause attempts are used here.
const msg=document.querySelector('#authMessage');
const form=document.querySelector('#authForm');
const email=document.querySelector('#email');
const password=document.querySelector('#password');
const submit=document.querySelector('#submit');
let enabled=false;
const setMsg=(s,cls='')=>{msg.className=cls;msg.textContent=s;};
fetch('/api/enchev-auth/session',{credentials:'same-origin',cache:'no-store'})
.then(r=>r.json()).then(data=>{
enabled=data?.available===true;
if(data?.authenticated){submit.textContent='МОЯТ ПРОФИЛ ↗';setMsg('Успешно сте влезли.','good');return;}
setMsg(enabled?'Входът с имейл е наличен.':'Защитеният вход все още не е активиран.');
}).catch(()=>setMsg('Временно няма връзка с услугата за вход.','error'));
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(submit.textContent.includes('МОЯТ ПРОФИЛ')){top.location.assign('/profile');return;}
 if(!enabled){top.location.assign('/login');return;}
 if(!email.validity.valid||!password.validity.valid){setMsg('Въведете валиден имейл и парола с минимум 12 символа.','error');return;}
 submit.disabled=true;setMsg('Проверка на данните...');
 try{
 const r=await fetch('/api/enchev-auth/sign-in',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email.value,password:password.value})});
 const data=await r.json();
 if(r.ok&&data.ok===true&&data.authenticated===true){password.value='';top.location.assign('/profile');return;}
 setMsg(data.error||'Неуспешен вход.','error');
 }catch{setMsg('Проблем с връзката. Опитайте отново.','error');}
 finally{password.value='';submit.disabled=false;}
});
const info={
 google:'Входът с Google/Gmail ще работи след активиране на OAuth.',
 meta:'Входът с Meta/Facebook ще работи след активиране на OAuth.',
 phone:'Входът с телефонен номер ще работи след настройване на SMS потвърждение.'
};
document.querySelectorAll('[data-provider]').forEach(button=>button.addEventListener('click',()=>setMsg(info[button.dataset.provider],'error')));
})();
</script>
</body>
</html>
